name: Release

on:
  push:
    tags: ['nudat-cli-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify the release without publishing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate tag against CLI version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py --check-tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test workspace
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release -p nudat-cli --target ${{ matrix.target }}
      - name: Package and smoke test
        run: python scripts/package-release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nudat-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crates:
    name: Publish to crates.io
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Require main for releases
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/main' }}
        run: |
          echo 'Releases must be dispatched from main.' >&2
          exit 1
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        if: ${{ !inputs.dry-run }}
        id: auth
      - name: Publish crates
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            cargo publish --locked --workspace --dry-run
            exit 0
          fi
          tag="nudat-cli-v$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "nudat-cli") | .version')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release $tag is already published; bump the versions in Cargo.toml." >&2
            exit 1
          fi
          # Publish in dependency order and skip versions that already exist, so reruns are safe.
          for crate in nudat nudat-cli; do
            version="$(cargo metadata --locked --no-deps --format-version 1 |
              jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
            if curl -fs -A "$GITHUB_REPOSITORY release workflow" -o /dev/null \
              "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io, skipping."
            else
              cargo publish --locked -p "$crate"
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    if: >-
      !cancelled() && needs.build.result == 'success' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nudat-cli-v')) ||
        (github.event_name == 'workflow_dispatch' && !inputs.dry-run && needs.crates.result == 'success')
      )
    needs: [build, crates]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nudat-cli-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and upload release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || needs.crates.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true || {
              echo 'Refusing to replace assets on a published release.' >&2
              exit 1
            }
          else
            version="${RELEASE_TAG#nudat-cli-v}"
            flags=()
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then flags+=(--verify-tag); else flags+=(--target "$GITHUB_SHA"); fi
            gh release create "$RELEASE_TAG" --draft \
              --title "nudat $version" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS --clobber
          # Tag pushes leave a draft for review; manual releases publish once all assets are attached.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
