[workspace]
members = ["cli"]
default-members = [".", "cli"]
resolver = "2"

[package]
name = "nudat"
version = "0.1.0"
edition = "2021"
description = "Read and edit Traveller's Tales Nu engine DAT archives"
license = "MIT"
repository = "https://github.com/opensagadev/nudat"
readme = "README.md"
keywords = ["archive", "dat", "obb", "modding"]
categories = ["command-line-utilities", "encoding", "games"]

[dependencies]
binrw = "0.15"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
miniz_oxide = "0.9"
thiserror = "2"
