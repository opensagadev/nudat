[workspace]
members = ["cli"]
default-members = [".", "cli"]
resolver = "2"

[package]
name = "nudat"
version = "0.1.0"
edition = "2021"
description = "Read and edit Traveller's Tales Nu engine DAT archives"
license = "MIT"
repository = "https://github.com/opensagadev/nudat"
readme = "README.md"
keywords = ["archive", "dat", "obb", "modding"]
categories = ["command-line-utilities", "encoding", "games"]

[features]
default = ["native"]
native = ["dep:rayon", "dep:tempfile", "dep:miniz_oxide"]

[dependencies]
binrw = "0.15"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
miniz_oxide = { version = "0.9", optional = true }
rayon = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"

[[test]]
name = "roundtrip"
required-features = ["native"]
